name: Generate Mod Changelog

on:
  push:
    paths:
      - "changelogs/manifest.json"

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history to allow commits

      # 2️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: pip install requests

      # 4️⃣ Generate changelog
      - name: Generate mods changelog
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: python changelogs/generate_changelog.py

      # 5️⃣ Commit changes
      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Add changelogs, cache, and old manifest
          git add changelogs/*.md
          git add changelogs/cf_cache.json || echo "No cache file"
          git add changelogs/manifest_old.json || echo "No old manifest yet"

          # Commit safely
          git commit -m "Update mod changelog" || echo "No changes to commit"

          # Push
          git push
